<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>张逸舒｜个人作品集</title>
    <meta name="description" content="张逸舒的个人作品集，记录内容运营、项目实践与创意探索。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="riso-grain" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-dot"></span>
        <span data-bind="name">张逸舒作品集</span>
      </a>
      <nav class="nav" aria-label="作品集导航">
        <a aria-current="page" href="./index.html">首页</a>
        <a href="./about.html">关于</a>
        <a href="./projects.html">实践/实习</a>
        <a href="./works.html">作品</a>
        <a href="./contact.html">联系</a>
      </nav>
    </header>

    <main>
      <section class="home-page ocean-page" aria-labelledby="home-title">
        <img class="dream-decoration dream-decoration-home dream-decoration-angel" src="./assets/decorations/cutouts/angel-fairies-cutout.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        <span class="dream-decoration dream-decoration-home dream-decoration-stars" aria-hidden="true"></span>
        <div class="open-book" aria-label="打开个人作品集">
          <div class="book-page book-left">
            <div class="home-copy">
              <span class="tape tape-a"></span>
              <p class="eyebrow">Dreamy Ocean Archive</p>
              <h1 id="home-title" data-bind="homeTitle">Ocean Notes of Yishu</h1>
              <p class="home-line" data-bind="homeLine">
                A personal archive of projects, fragments and quiet experiments.
              </p>
              <a class="portfolio-button" href="./projects.html">浏览项目</a>
            </div>
            <div class="book-note note-left">personal notes</div>
            <div class="floating-fish fish-three"></div>
          </div>
          <div class="book-page book-right">
            <figure class="polaroid home-polaroid">
              <div class="photo-placeholder ocean-photo">
                <img src="./assets/home/dream-ocean.jpg" alt="梦核海洋氛围图" decoding="async" fetchpriority="high" />
              </div>
              <figcaption>campus / notes / memory</figcaption>
            </figure>
            <div class="home-mini-tags" aria-label="Creative tags">
              <span>Content Creator</span>
              <span>AI Explorer</span>
              <span>New Media Practice</span>
              <span>Visual Storytelling</span>
            </div>
            <div class="home-archive-label">
              <span>STARTED IN 2026</span>
              <strong>CONTENT / AI / CREATIVE</strong>
            </div>
            <div class="book-note">projects</div>
            <div class="book-grid"></div>
            <div class="floating-fish fish-one"></div>
            <div class="floating-fish fish-two"></div>
            <a class="page-corner" href="./about.html" aria-label="Turn to About page"></a>
          </div>
        </div>
      </section>
    </main>

    <script src="./assets/vendor/lenis.min.js" defer></script>
    <script src="./assets/vendor/gsap.min.js" defer></script>
    <script src="./assets/vendor/ScrollTrigger.min.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./motion.js" defer></script>
  </body>
</html>
