<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我｜张逸舒作品集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="riso-grain" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="./index.html"><span class="brand-dot"></span><span data-bind="name">张逸舒作品集</span></a>
      <nav class="nav" aria-label="作品集导航">
        <a href="./index.html">首页</a>
        <a aria-current="page" href="./about.html">关于</a>
        <a href="./projects.html">实践/实习</a>
        <a href="./works.html">作品</a>
        <a href="./contact.html">联系</a>
      </nav>
    </header>

    <main>
      <section class="page about-page" aria-labelledby="about-title">
        <img class="dream-decoration dream-decoration-about dream-decoration-flower" src="./assets/decorations/cutouts/blue-lily-cutout.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        <span class="dream-decoration dream-decoration-about dream-decoration-sparkle" aria-hidden="true"></span>
        <div class="section-title">
          <span>01</span>
          <h1 id="about-title">关于我</h1>
        </div>
        <div class="about-book">
          <div class="about-copy">
            <h2 class="hello-line">你好，我是<span data-bind="displayName">张逸舒</span>。</h2>
            <p class="about-meta">
              <span data-bind="school">湖南理工大学</span>
              <span data-bind="major">应用化学</span>
              <span data-bind="grade">2028 届毕业生</span>
            </p>
            <p class="about-brief" data-bind="about"></p>
            <div class="tag-cloud" id="about-tags" aria-label="经验关键词"></div>
          </div>

          <figure class="polaroid about-photo">
            <div class="about-photo-frame">
              <img src="./assets/about/zhang-yishu.jpg" alt="张逸舒个人照片" decoding="async" />
            </div>
          </figure>

          <section class="about-highlights" aria-labelledby="about-highlights-title">
            <div class="about-highlights-heading">
              <p>实践与结果</p>
              <h2 id="about-highlights-title">经历速览</h2>
            </div>
            <div class="about-highlights-body">
              <ul id="about-highlights-list"></ul>
              <a href="./projects.html">查看实践/实习</a>
            </div>
          </section>

          <section class="little-universe" aria-labelledby="little-universe-title">
            <p class="little-universe-kicker">兴趣档案</p>
            <h2 id="little-universe-title">我的小宇宙</h2>
            <div class="universe-collage">
              <article class="universe-card universe-card-one">
                <div class="universe-photo">
                  <img src="./assets/about/universe/otome-character.jpg" alt="二次元棉花娃娃收藏" loading="lazy" decoding="async" />
                </div>
                <h3>角色收藏</h3>
                <p>乙女游戏、角色故事和棉花娃娃，是我一直喜欢的内容。</p>
              </article>
              <article class="universe-card universe-card-two">
                <div class="universe-photo">
                  <img src="./assets/about/universe/fandom-collection.jpg" alt="吃谷追星收藏" loading="lazy" decoding="async" />
                </div>
                <h3>追星与谷子</h3>
                <p>收藏喜欢的作品，也留意同好之间怎么交流、分享。</p>
              </article>
              <article class="universe-card universe-card-three">
                <div class="universe-photo">
                  <img src="./assets/about/universe/offline-concert.jpg" alt="线下演唱会记录" loading="lazy" decoding="async" />
                </div>
                <h3>线下现场</h3>
                <p>去演唱会，把喜欢的声音和瞬间留下来。</p>
              </article>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="./assets/vendor/lenis.min.js" defer></script>
    <script src="./assets/vendor/gsap.min.js" defer></script>
    <script src="./assets/vendor/ScrollTrigger.min.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./motion.js" defer></script>
  </body>
</html>
