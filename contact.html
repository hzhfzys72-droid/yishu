<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我｜张逸舒作品集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="contact-body">
    <div class="riso-grain" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="./index.html"><span class="brand-dot"></span><span data-bind="name">张逸舒作品集</span></a>
      <nav class="nav" aria-label="作品集导航">
        <a href="./index.html">首页</a>
        <a href="./about.html">关于</a>
        <a href="./projects.html">实践/实习</a>
        <a href="./works.html">作品</a>
        <a aria-current="page" href="./contact.html">联系</a>
      </nav>
    </header>

    <main>
      <section class="contact-page" aria-labelledby="contact-title">
        <div class="contact-sheet">
          <img class="dream-decoration dream-decoration-contact dream-decoration-flower-small" src="./assets/decorations/cutouts/blue-lily-cutout.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <p class="eyebrow">Last Page</p>
          <h1 id="contact-title">谢谢你来到我的世界。</h1>
          <p class="contact-intro">如果有合适的实习机会，欢迎直接给我发邮件。</p>

          <div class="contact-layout">
            <div class="contact-left">
              <div class="status-card">
                <p>正在寻找实习机会</p>
                <ul>
                  <li>内容运营</li>
                  <li>游戏运营</li>
                </ul>
                <p class="contact-availability">可立即到岗 · 可持续实习六个月 · 期望城市：杭州、上海</p>
              </div>

              <div class="contact-primary">
                <div>
                  <p class="contact-label">Email</p>
                  <div class="contact-email-row">
                    <a class="email-card" href="mailto:zyfish421@163.com">zyfish421@163.com</a>
                    <button class="contact-copy contact-email-copy" type="button" data-copy="zyfish421@163.com" aria-label="复制邮箱地址">复制</button>
                  </div>
                </div>
                <a class="resume-button" href="./assets/resume/resume.pdf" download>下载简历</a>
              </div>

              <div class="contact-secondary">
                <p class="contact-label">社交平台</p>
                <div class="contact-social-row">
                  <span class="social-card">小红书：hhhzhf_0421</span>
                  <button class="contact-copy" type="button" data-copy="hhhzhf_0421" aria-label="复制小红书账号">复制</button>
                </div>
                <div class="contact-social-row">
                  <span class="social-card">抖音：bbbb1015</span>
                  <button class="contact-copy" type="button" data-copy="bbbb1015" aria-label="复制抖音账号">复制</button>
                </div>
              </div>
            </div>

            <figure class="qr-card">
              <p class="contact-label">扫码联系我</p>
              <img src="./assets/contact/wechat-qr.png" alt="微信二维码" decoding="async" />
            </figure>
          </div>
        </div>
      </section>
    </main>

    <script src="./assets/vendor/lenis.min.js" defer></script>
    <script src="./assets/vendor/gsap.min.js" defer></script>
    <script src="./assets/vendor/ScrollTrigger.min.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./motion.js" defer></script>
  </body>
</html>
